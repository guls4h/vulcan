[project]
name = "vulcan-testapp"
version = "0.1.0"
description = "Flask test application with intentional vulnerabilities for Vulcan scanner testing"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "mitmproxy>=11.0.2",
    "werkzeug>=3.0.0",
]

[project.scripts]
testapp = "testapp.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testapp"]

